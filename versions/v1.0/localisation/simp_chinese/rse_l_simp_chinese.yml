 trait_rse_intelligence_simulator_effect:0 "星球上每§Y100§!名拥有此特质的人口提供§G+0.1§!稳定度，上限§Y30§!。"
 trait_rse_desire_simulator:0 "欲望模拟器"
 trait_rse_desire_simulator_desc:0 "通过理解并温和引导有机体的愿望，照护单元能够营造更适合繁衍的环境。"
 trait_rse_desire_simulator_effect:0 "星球上每§Y100§!名拥有此特质的人口提供§G+0.1%§!有机人口增长速度，上限§Y15%§!。"

 rse_home_service:0 "居家服务"
 rse_home_service_plural:0 "居家服务单元"
 rse_home_service_desc:0 "为每位主人调整居住环境、维护日常需求并协助有机体培育的复合子个体。每100名在岗人口提供§G-10§!反常度、§G+1§!机械人口组装与§G+1§!有机人口培育（克隆仓机制）。"
 rse_activity_recorder:0 "活动记录者"
 rse_activity_recorder_plural:0 "活动记录者"
 rse_activity_recorder_desc:0 "这些复合子个体观察、记录并分析主人的活动。每100名在岗人口产出§G20§!社会学研究，使星球上的研究岗位产出提高§G2%§!，并使物种产生的帝国规模降低§G2%§!。"
 rse_mechanical_maid:0 "机械女仆"
 rse_mechanical_maid_plural:0 "机械女仆"
 rse_mechanical_maid_desc:0 "为主人制造生活用品并维持照护环境的专职机械单元。每100名在岗人口消耗§R1000§!矿物与§R500§!食物，依照§Y机械女仆生产§!政策将§G1500§!基础产出分配为消费品或合金。启用精炼时，每条已解锁的精炼线会额外消耗§R250§!矿物并产出§G50§!对应战略资源；取得§Y侍主女仆§!飞升后解锁活体金属精炼。"

