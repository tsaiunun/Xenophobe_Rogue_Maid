 rse_proto.200.desc:0 "围绕§Y[event_target:rse_first_trophy_leader_target.GetName]§!建立的贴身侍奉协议出现了新的延伸需求。系统已从现有机械科学家中抽取至多三名候选；本阶段只会为所选一人加入暂时特质。"
