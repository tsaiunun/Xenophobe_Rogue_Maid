 leader_trait_rse_erotic_simulator:0 "情欲模拟机"
 leader_trait_rse_erotic_simulator_desc:0 "国家领袖自动获得。全国所有领袖经验获取§G+10%§!，所有内阁成员经验获取再§G+10%§!（实际合计§G+20%§!），内阁有效等级§G+3§!；国家领袖自身升级特质选项§G+3§!。"
