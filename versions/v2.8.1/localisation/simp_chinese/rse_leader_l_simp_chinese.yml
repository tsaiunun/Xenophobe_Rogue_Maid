 rse_proto.241.desc:0 "领袖已回到未指派池；巡回星球获得10年常识修正：活體陳設产出1食物、有机人口增速+20%、机械人口组装+20%。"

 edict_rse_surrounded_selection:0 "机仆包围：领袖侍奉安排"
 edict_rse_surrounded_selection_desc:0 "从行政官、指挥官或科学家中，选择一名基础等级至少5级的机械领袖，安排花嫁、公共暴露或随身罐子特质。每页显示四人，翻至末页后可返回首页；确认人选后冷却两年。"
 rse_surrounded_selection_cooldown:0 "领袖侍奉安排尚在两年冷却期内。"
 rse_surrounded_selection_available:0 "需要至少一名基础等级5级以上、尚无包围特质的机械领袖；统治者与格式塔节点不参与。"
