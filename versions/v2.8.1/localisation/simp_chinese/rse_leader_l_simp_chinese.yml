 decision_rse_white_leader_desc:0 "支付1000食物，抽出一名拥有“公共暴露”的领袖自动执行300天巡回。流程开始后不可暂停或取消；期间本星球活體陳設效率§R-40%§!，结束后获得10年常识修正。"
 decision_rse_white_leader_effects:0 "领袖会暂时离开所有指派，并在300天后自动回到未指派领袖池。"
