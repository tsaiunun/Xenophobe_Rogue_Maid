 rse_home_service:0 "居家服务"
 rse_home_service_plural:0 "居家服务单元"
 rse_home_service_desc:0 "为每位主人调整居住环境、维护日常需求并协助有机体培育的侍奉者。在100%岗位效率下，每100名在岗人口消耗£energy£§R0.5§!，提供§G-20§!反常度、§G+0.2§!机械人口组装、§G+0.2§!有机人口培育（克隆仓机制）与§G1§!支行星防御部队。以上效果会随岗位效率变化；两类组装各自使用同一居家服务来源上限：普通星球§Y10§!，理想乐园§Y20§!。"
 rse_activity_recorder:0 "活动记录者"
 rse_activity_recorder_plural:0 "活动记录者"
 rse_activity_recorder_desc:0 "这些侍奉者观察、记录并分析主人的活动。在100%岗位效率下，每100名在岗人口消耗£energy£§R0.5§!，提供£society£§G12§!社会学研究、其他研究岗位产出§G+4%§!与人口帝国规模§G-2%§!。所有效果均会随岗位效率变化。"
 rse_mechanical_maid:0 "机械女仆"
 rse_mechanical_maid_plural:0 "机械女仆"
 rse_mechanical_maid_desc:0 "为主人制造生活用品并维持照护环境的专职机械单元。在100%岗位效率下，每100名在岗人口消耗£minerals£§R13.33§!与£food£§R6.67§!，依照§Y机械女仆生产§!政策将§G20§!基础产出分配为消费品或合金。启用精炼时，每条旧式稀有资源线额外消耗£minerals£§R3.33§!并产出§G0.67§!资源；合成时代路线、跨维度运算与暗物质科技还会增加对应产线。"

