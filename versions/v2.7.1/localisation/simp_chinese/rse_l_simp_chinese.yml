 # V2.7.1 war and Supervisory Zone
 casus_belli_cb_rse_polluted_database:0 "污染数据库"
 casus_belli_cb_rse_polluted_database_acquire_hint:0 "完成§Y侍主女仆§!飞升后，可对主体物种并非受保护活體陳设的普通有机帝国发动§Y污染数据库§!战争；不要求实力对比。"
 war_goal_wg_rse_polluted_database:0 "清洗污染数据库"
 war_goal_wg_rse_polluted_database_desc:0 "以原版强制附庸流程建立§Y监管地§!。胜利时整个敌国成为监管地；维持现状时，包含已占领殖民地的占领区域会被释放为监管地。\n\n战后每个监管地殖民地增加§Y2§!个宗主主体机械人口；匹配的活體陳设物种保留，其他有机物种设为不可接触者，外来机械物种设为同化。"
 preset_rse_supervisory_zone:0 "监管地"
 preset_rse_supervisory_zone_desc:0 "由专属侍奉网络直接监管的附属国。初始契约允许整合、限制外交、允许扩张、共享传感器，并提供每月忠诚度。"
 preset_rse_supervisory_zone_flavor_desc:0 "当地政府只保留执行照护协议所需的有限权限。"
 specialist_rse_supervisory_zone:0 "监管地"
 specialist_rse_supervisory_zone_desc:0 "随等级为宗主全部殖民地提供舒适度，并提高舰船亚光速航速与免受多附属国忠诚惩罚的数量。"
 specialist_rse_supervisory_zone_summary:0 "监管地会将社会资源直接接入宗主的侍奉网络。"
 rse_supervisory_zone_1:0 "监管网络 I"
 rse_supervisory_zone_1_desc:0 "宗主全部殖民地舒适度§G+100§!、舰船亚光速航速§G+5%§!、免受多附属国忠诚惩罚的属国数量§G+1§!。"
 rse_supervisory_zone_2:0 "监管网络 II"
 rse_supervisory_zone_2_desc:0 "累计使宗主全部殖民地舒适度达到§G+200§!、舰船亚光速航速达到§G+10%§!、豁免属国数量达到§G+2§!。"
 rse_supervisory_zone_3:0 "监管网络 III"
 rse_supervisory_zone_3_desc:0 "累计使宗主全部殖民地舒适度达到§G+300§!、舰船亚光速航速达到§G+15%§!、豁免属国数量达到§G+3§!。"
 rse_database_cleaning:0 "数据库清洗"
 rse_database_cleaning_desc:0 "人口净化速度§G+1000%§!，持续10年。"
 rse_supervisory_zone_initial_loyalty:0 "监管协议"
 rse_supervisory_zone_initial_loyalty_desc:0 "每月忠诚度§G+10§!。"
 holding_rse_social_observer:0 "社会观察器"
 holding_rse_social_observer_desc:0 "监管地专属宗主国地产。每月忠诚度§G+0.5§!，并使宗主除机械女仆外的模组独特岗位效率§G+5%§!。"
 rse_requires_supervisory_zone:0 "§R仅能在监管地附属国建造。§!"

