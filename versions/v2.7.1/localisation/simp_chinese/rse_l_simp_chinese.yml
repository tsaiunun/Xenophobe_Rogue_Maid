 rse_v2.40.name:0 "艾草"
 rse_v2.40.desc:0 "地下节目网络完成了一套名为『艾草』的外交与动员协议。它把观众情绪转化为关系操控与造舰动员。"
 rse_v2.40.a:0 "将协议部署至全境。"
