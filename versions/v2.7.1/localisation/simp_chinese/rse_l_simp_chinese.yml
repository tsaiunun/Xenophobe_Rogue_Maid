 rse_v2.20.name:0 "重新伟大的种族"
 rse_v2.20.desc:0 "我们的主人不再只是被动接受服务。他们的个体经验足以承担领袖职责，而照护网络将确保这种职责不会成为负担。第一位主人科学家将立即加入领袖池，之后可通过专属法令继续招募。"
